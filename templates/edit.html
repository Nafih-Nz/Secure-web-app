<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background: linear-gradient(to right,#020617,#0f172a,#1e293b);
            min-height:100vh;
            font-family: Arial, sans-serif;
            color:white;
        }

        .edit-container{
            max-width:750px;
            margin:auto;
            margin-top:80px;
            background:#1e293b;
            padding:40px;
            border-radius:25px;
            box-shadow:0 5px 25px rgba(0,0,0,0.4);
        }

        .title{
            font-size:45px;
            font-weight:bold;
            margin-bottom:10px;
        }

        .subtitle{
            color:#cbd5e1;
            margin-bottom:35px;
        }

        .form-control{
            height:55px;
            border-radius:12px;
            margin-bottom:20px;
            border:none;
        }

        textarea.form-control{
            height:150px;
        }

        .btn-custom{
            padding:12px 28px;
            border-radius:12px;
            font-size:18px;
            transition:0.3s;
        }

        .btn-custom:hover{
            transform:scale(1.03);
        }

        .back-btn{
            text-decoration:none;
            color:#38bdf8;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="edit-container">

            <a href="/dashboard" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Dashboard
            </a>

            <h1 class="title mt-3">
                Edit Task
            </h1>

            <p class="subtitle">
                Update your task information securely
            </p>

            <form method="POST">

    <input type="hidden"
           name="csrf_token"
           value="{{ csrf_token() }}">

    <input type="text"
           name="title"
           class="form-control"
           value="{{ task.title }}"
           required>

    <textarea name="description"
              class="form-control"
              required>{{ task.description }}</textarea>

    <button type="submit"
            class="btn btn-primary btn-custom">

        <i class="fa-solid fa-pen"></i>
        Update Task

    </button>

</form>
        </div>

    </div>

</body>
</html>
