<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right,#0f172a,#1e293b);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-box{
            width:450px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
        }

        .register-box h1{
            text-align:center;
            margin-bottom:30px;
            font-weight:bold;
            color:#0f172a;
        }

        .form-control{
            height:50px;
            border-radius:10px;
            margin-bottom:20px;
        }

        .btn-register{
            width:100%;
            height:50px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:18px;
            transition:0.3s;
        }

        .btn-register:hover{
            background:#1d4ed8;
            transform:scale(1.02);
        }

        .icon{
            text-align:center;
            font-size:60px;
            color:#2563eb;
            margin-bottom:20px;
        }

        .login-link{
            text-align:center;
            margin-top:20px;
        }

        .login-link a{
            text-decoration:none;
            color:#2563eb;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="register-box">

        <div class="icon">
            <i class="fa-solid fa-user-shield"></i>
        </div>

        <h1>Create Account</h1>

        <form method="POST">

            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter Username"
                   required>

            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter Email"
                   required>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter Password"
                   required>

            <button type="submit" class="btn-register">
                Register
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </div>

    </div>

</body>
</html>
