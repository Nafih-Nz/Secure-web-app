<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background: linear-gradient(to right,#020617,#0f172a,#1e293b);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, sans-serif;
        }

        .login-box{
            width:450px;
            background:#1e293b;
            padding:40px;
            border-radius:25px;
            box-shadow:0 5px 30px rgba(0,0,0,0.5);
            color:white;
        }

        .title{
            font-size:45px;
            font-weight:bold;
            margin-bottom:10px;
        }

        .subtitle{
            color:#cbd5e1;
            margin-bottom:30px;
        }

        .form-control{
            height:55px;
            border-radius:12px;
            margin-bottom:20px;
            border:none;
        }

        .btn-login{
            width:100%;
            height:55px;
            border-radius:12px;
            font-size:18px;
            font-weight:bold;
        }

        .register-link{
            text-align:center;
            margin-top:20px;
        }

        .register-link a{
            color:#38bdf8;
            text-decoration:none;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1 class="title">
            Login
        </h1>

        <p class="subtitle">
            Secure Cloud Dashboard Access
        </p>

        {% if error %}

        <div class="alert alert-danger alert-dismissible fade show"
             role="alert">

            <i class="fa-solid fa-circle-exclamation"></i>
            {{ error }}

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"></button>

        </div>

        {% endif %}

     <form method="POST">

    <input type="hidden"
           name="csrf_token"
           value="{{ csrf_token() }}">

    <input type="email"
           name="email"
           class="form-control"
           placeholder="Enter Email"
           required>

    <input type="password"
           name="password"
           class="form-control"
           placeholder="Enter Password"
           required>

    <button type="submit"
            class="btn btn-success btn-login">

        <i class="fa-solid fa-right-to-bracket"></i>
        Login

    </button>

</form>

        <div class="register-link">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
